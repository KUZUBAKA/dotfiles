[ids]
*

 [main]
 rightalt = layer(new_layer)  
 leftshift+leftmeta+f23 = layer(new_layer)
 katakanahiragana = layer(new_layer)
 muhenkan = layer(new_layer)
henkan = layer(new_layer)

 capslock = `
 rightshift = ro
 rightcontrol = yen
 compose = yen
 ` = esc

 [new_layer]

 space = muhenkan
 p = print
 n = numlock
 1 = kp1
 2 = kp2
 3 = kp3
 4 = kp4
 5 = kp5
 6 = kp6
 7 = kp7
 8 = kp8
 9 = kp9
 0 = kp0
 u = print
 w = up
 a = left
 d = right
 s = down
 i = volumeup
 k = volumedown
 backspace = delete
